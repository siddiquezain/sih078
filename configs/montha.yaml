# Montha 2025 cyclone + extreme-rain event
# Runs: 00 UTC inits 2025-10-20 to 2025-10-29
# Region: 8–24 N, 74–90 E
label: replay
region:
  lat_min: 8.0
  lat_max: 24.0
  lon_min: 74.0
  lon_max: 90.0
init_dates:
  start: "2025-10-20"
  end: "2025-10-29"
target_day_search:
  # Pick the IMD day(s) between 26–31 Oct with largest area >= 115.6 mm
  start: "2025-10-26"
  end: "2025-10-31"
  threshold_mm: 115.6
  min_cells: 10
rain_thresholds:
  heavy: 64.5
  very_heavy: 115.6
  extremely_heavy: 204.5
objects:
  min_area_cells: 5
  p_min: 0.1
crossrun:
  max_centroid_km: 500.0
  lockon_drift_km: 100.0
  lockon_iou: 0.5
fss:
  windows_cells: [1, 3, 5, 7, 9, 13]
cache_dir: "cache/montha"
output_dir: "outputs/montha"
