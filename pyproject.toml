[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "resolve"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "xarray>=2024.1",
    "zarr>=2.16",
    "dask[array]>=2024.1",
    "numpy>=1.26",
    "scipy>=1.12",
    "pandas>=2.1",
    "matplotlib>=3.8",
    "pyyaml>=6.0",
    "dynamical-catalog>=0.8.0",
    "imdlib>=0.1.8",
    "earthaccess>=0.9",
    "pytest>=8.0",
]

[project.optional-dependencies]
plot = ["cartopy>=0.23"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-v"
